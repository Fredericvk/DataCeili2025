enable_native_execution_engine: false
driver_cores: 8
driver_memory: 56g
executor_cores: 8
executor_memory: 56g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 5
spark_conf:
  spark.synapse.diagnostic.emitters: MyEventStreamForLogs
  spark.synapse.diagnostic.emitter.MyEventStreamForLogs.type: AzureEventHub
  'spark.synapse.diagnostic.emitter.MyEventStreamForLogs.categories ': Log,EventLog,Metrics
  spark.synapse.diagnostic.emitter.MyEventStreamForLogs.secret: ''
  spark.fabric.pools.skipStarterPools: True
runtime_version: 1.3
